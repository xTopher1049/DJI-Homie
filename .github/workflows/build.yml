name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK with licenses pre-accepted;
      # Gradle/AGP find it via ANDROID_HOME and auto-fetch missing components.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      # Releases take their version from the tag (v0.2.0 -> 0.2.0); every other
      # build is 0.2.<run>. Bump the prefix here when starting a new minor line.
      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.2.${{ github.run_number }}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Version: $V"

      - name: Build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dji-homie-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
