name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Rebuild an existing release from its tag and attach the APK (e.g. v0.2.0). Leave empty for a normal build."
        required: false
        default: ""
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Tag being released: a new GitHub Release, or a manual rebuild of one.
      RELEASE_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK with licenses pre-accepted;
      # Gradle/AGP find it via ANDROID_HOME and auto-fetch missing components.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      # Releases take their version from the tag (v0.2.0 -> 0.2.0); every other
      # build is 0.2.<run>. Bump the prefix here when starting a new minor line.
      - name: Set version
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            V="${RELEASE_TAG#v}"
          else
            V="0.2.${{ github.run_number }}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Version: $V"

      - name: Build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Name APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DJI-Homie-v${VERSION_NAME}.apk"
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJI-Homie-v${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.apk
